name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: hisabkhata2026
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Read version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - run: cp app/build/outputs/apk/release/app-release.apk HisabKhata.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: হিসাব খাতা ${{ steps.v.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: HisabKhata.apk
          make_latest: true
